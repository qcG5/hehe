<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bir Sorum Var ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    color: #fff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .screen {
    width: 100%;
    min-height: 100%;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  h1 {
    font-size: clamp(2rem, 7vw, 5rem);
    margin: 0 0 35px;
    line-height: 1.15;
  }

  .buttons {
    display: flex;
    gap: 18px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    border: 0;
    border-radius: 14px;
    padding: 15px 30px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .35s ease;
  }

  #yes {
    background: #fff;
    color: #000;
  }

  #no {
    background: #242424;
    color: #fff;
  }

  #result {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100%;
    position: absolute;
    inset: 0;
    background: #000;
    padding: 25px;
  }

  #result h2 {
    font-size: clamp(2rem, 7vw, 5rem);
    margin: 0 0 25px;
  }

  .love-wall {
    width: 100%;
    height: 55vh;
    overflow: hidden;
    color: #fff;
    font-size: clamp(1.1rem, 3vw, 2rem);
    line-height: 1.7;
    word-break: break-word;
    opacity: .9;
  }

  .love-wall span {
    margin-right: 12px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="screen" id="questionScreen">
  <h1>Burak'ı seviyor musun? ❤️</h1>

  <div class="buttons">
    <button id="yes">Evet ❤️</button>
    <button id="no">Hayır</button>
  </div>
</div>

<div id="result">
  <h2>Harika, ben de seni seviyorum! ❤️</h2>
  <div class="love-wall" id="loveWall"></div>
</div>

<script>
  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const questionScreen = document.getElementById("questionScreen");
  const result = document.getElementById("result");
  const loveWall = document.getElementById("loveWall");

  let noSize = 1;

  function showLove() {
    questionScreen.style.display = "none";
    result.style.display = "flex";

    const words = Array(180).fill("<span>Seni seviyorum ❤️</span>").join(" ");
    loveWall.innerHTML = words;
  }

  yes.addEventListener("click", showLove);

  no.addEventListener("click", () => {
    noSize += 0.55;

    // Hayır'a her basıldığında Evet büyüyor.
    yes.style.transform = `scale(${noSize})`;

    // Sonunda Evet ekranı kaplayacak kadar büyüsün.
    if (noSize >= 6) {
      yes.style.position = "fixed";
      yes.style.inset = "0";
      yes.style.width = "100vw";
      yes.style.height = "100vh";
      yes.style.borderRadius = "0";
      yes.style.fontSize = "clamp(2rem, 10vw, 7rem)";
      yes.textContent = "EVET ❤️";
    }
  });
</script>

</body>
</html>
